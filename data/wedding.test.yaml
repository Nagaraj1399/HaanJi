faqs:
  - q: "Is Jain and no-onion-garlic food available?"
    a: "Yes, every function has a dedicated Jain and no-onion-garlic counter clearly labelled at the buffet."
  - q: "Where is parking available?"
    a: "Complimentary valet parking is at Gate 2 for Tamarind Tree and at the Main Porch for Leela Palace."
  - q: "What is the dress code for Mehendi?"
    a: "Yellow, mustard, or floral festive wear for the Mehendi & Haldi at 11:00 AM."
  - q: "What time does Sangeet start?"
    a: "Sangeet Night starts at 7:30 PM on 28 Nov 2026 at Lotus Courtyard, Tamarind Tree."
  - q: "When is the Shaadi / Muhurat?"
    a: "Muhurat & Shaadi is at 9:30 AM on 29 Nov 2026 at Banyan Mandap, Tamarind Tree."
  - q: "Are kids welcome?"
    a: "Yes, kids are warmly welcome at all four functions, with high chairs and mild kid-friendly meals available."
  - q: "Is there a shuttle from the hotel?"
    a: "Yes, shuttle vans run every 20 minutes from Taj MG Road to Tamarind Tree starting 8:30 AM on 29 Nov."
  - q: "How do I get to Tamarind Tree?"
    a: "Tamarind Tree is on Kanakapura Road, Bengaluru (Google Maps: https://maps.google.com/?q=The+Tamarind+Tree+Bengaluru)."
